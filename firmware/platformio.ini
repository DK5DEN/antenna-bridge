; antenna-bridge — CAT to antenna control bridge, ESP32-C3 Super Mini
; Console on native USB CDC, rig CAT on UART0 (GPIO20 RX / GPIO21 TX)

[env:esp32c3_supermini]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

; BLE + WiFi + web server do not fit the 1.25 MB default app slot
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    bblanchon/ArduinoJson@^7.4.0

monitor_speed = 115200
monitor_port = COM17
upload_port = COM17
; USB-Serial/JTAG: open the console with DTR and RTS low, a DTR/RTS pulse resets the chip
